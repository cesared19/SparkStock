# SparkStock runs next to SparkyTC on the same server: its own database on the same PostgreSQL server, and its
# backend joins SparkyTC's docker network to sign users in with SparkyTC (and, later, to be called by it).
# Service names start with stock- so they never clash with SparkyTC's on the shared network.

x-database: &database
   DATABASE_URL: ${DATABASE_URL}
   DATABASE_USERNAME: ${DATABASE_USERNAME}
   DATABASE_PASSWORD: ${DATABASE_PASSWORD}

# pg_dump and pg_restore must be the PostgreSQL server's major version or newer.
x-backup-tools: &backup-tools
   image: ${BACKUP_IMAGE:-postgres:16}
   entrypoint: ['bash', '/scripts/backup.sh']
   volumes:
      - ./deploy/backup:/scripts:ro
      - ${BACKUP_DIR:-./backups}:/backups
   networks:
      - stock-network

services:
   # Daily backups, kept on this server in BACKUP_DIR (see the README).
   stock-database-backup:
      <<: *backup-tools
      command: ['schedule']
      environment:
         <<: *database
         TZ: ${TZ:-UTC}
         BACKUP_TIME: ${BACKUP_TIME:-03:15}
         BACKUP_KEEP_DAILY: ${BACKUP_KEEP_DAILY:-14}
         BACKUP_KEEP_WEEKLY: ${BACKUP_KEEP_WEEKLY:-8}
      healthcheck:
         test: ['CMD', 'bash', '/scripts/backup.sh', 'healthy']
         interval: 1h
         start_period: 1m
      restart: unless-stopped

   # Each `docker compose up` backs up the database before the backend migrates it (Flyway, on startup).
   stock-pre-migration-backup:
      <<: *backup-tools
      command: ['now', 'pre-migration']
      environment:
         <<: *database
         TZ: ${TZ:-UTC}
         BACKUP_KEEP_PRE_MIGRATION: ${BACKUP_KEEP_PRE_MIGRATION:-10}
      restart: 'no'

   stock-backend:
      build:
         context: ./service
         dockerfile: Dockerfile
      environment:
         <<: *database
         TZ: ${TZ:-UTC}
         SPARKYTC_API_URL: ${SPARKYTC_API_URL:-http://backend-service:8080}
         SPARKYTC_PUBLIC_URL: ${SPARKYTC_PUBLIC_URL:-}
         STOCK_INTEGRATION_TOKEN: ${STOCK_INTEGRATION_TOKEN:-}
         LOAN_DEFAULT_DAYS: ${LOAN_DEFAULT_DAYS:-7}
         LOAN_MAX_DAYS: ${LOAN_MAX_DAYS:-90}
         LOAN_ESCALATE_AFTER_DAYS: ${LOAN_ESCALATE_AFTER_DAYS:-3}
         WARRANTY_WARNING_DAYS: ${WARRANTY_WARNING_DAYS:-30}
         PUBLIC_URL: ${PUBLIC_URL:-}
         REMINDERS_CRON: ${REMINDERS_CRON:-0 0 9 * * *}
         # caps the JVM at about 300 MB of RAM in total; plenty for a small team
         JAVA_TOOL_OPTIONS: ${STOCK_JAVA_OPTIONS:--Xmx256m -XX:+UseSerialGC}
      # only reachable from the host itself
      ports:
         - '127.0.0.1:${STOCK_BACKEND_PORT:-8081}:8080'
      depends_on:
         stock-pre-migration-backup:
            condition: service_completed_successfully
      restart: unless-stopped
      networks:
         - stock-network
         - sparkytc-network

   stock-client:
      build:
         context: ./client
         dockerfile: Dockerfile
      environment:
         NODE_ENV: production
         TZ: ${TZ:-UTC}
         PORT: 3000
         API_URL: http://stock-backend:8080
         PUBLIC_URL: ${PUBLIC_URL:-}
         SPARKYTC_PUBLIC_URL: ${SPARKYTC_PUBLIC_URL:-}
         SESSION_SECRET: ${SESSION_SECRET:-}
         COOKIE_SECURE: ${COOKIE_SECURE:-false}
         LOAN_DEFAULT_DAYS: ${LOAN_DEFAULT_DAYS:-7}
      ports:
         - '${STOCK_PORT:-3100}:3000'
      depends_on:
         - stock-backend
      restart: unless-stopped
      networks:
         - stock-network

networks:
   stock-network:
      driver: bridge
   # SparkyTC's network, created by its own docker compose (<folder of SparkyTC's checkout>_app-network)
   sparkytc-network:
      external: true
      name: ${SPARKYTC_NETWORK:-sparkytc_app-network}
