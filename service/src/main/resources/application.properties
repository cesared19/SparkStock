spring.application.name=sparkstock-service

# database (its own database, on the same PostgreSQL server as SparkyTC)
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.flyway.enabled=true

spring.jackson.serialization.write-dates-as-timestamps=true
spring.jackson.default-property-inclusion=non_null

# SparkyTC: users sign in with their SparkyTC account, the backend is reached over the docker network
sparkstock.sparkytc.base-url=${SPARKYTC_API_URL:http://backend-service:8080}
# the address people open SparkyTC on, for links
sparkstock.sparkytc.public-url=${SPARKYTC_PUBLIC_URL:}
# how long a validated SparkyTC session is trusted before asking SparkyTC again
sparkstock.sparkytc.session-cache-seconds=${SPARKYTC_SESSION_CACHE_SECONDS:300}

# shared secret SparkyTC sends to /api/integration/v1 (Authorization: Bearer ...); the API is off while empty
sparkstock.integration.token=${STOCK_INTEGRATION_TOKEN:}

# loans
sparkstock.loans.default-days=${LOAN_DEFAULT_DAYS:7}
sparkstock.loans.max-days=${LOAN_MAX_DAYS:90}
# warranties ending within this many days are listed on the dashboard
sparkstock.warranty.warning-days=${WARRANTY_WARNING_DAYS:30}

spring.jpa.properties.hibernate.default_batch_fetch_size=100
